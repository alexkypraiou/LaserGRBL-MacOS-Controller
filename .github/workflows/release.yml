name: macOS Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"
      - name: Generate application assets
        run: |
          python scripts/generate_assets.py
          bash scripts/create_icns.sh
      - name: Build application bundle
        run: pyinstaller --noconfirm packaging/LaserGRBL-MacOS.spec
      - name: Apply ad-hoc signature
        run: codesign --force --deep --sign - "dist/LaserGRBL for macOS.app"
      - name: Package bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/LaserGRBL for macOS.app" "dist/LaserGRBL-for-macOS.zip"
          shasum -a 256 "dist/LaserGRBL-for-macOS.zip" > "dist/LaserGRBL-for-macOS.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: LaserGRBL-for-macOS
          path: |
            dist/LaserGRBL-for-macOS.zip
            dist/LaserGRBL-for-macOS.zip.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/LaserGRBL-for-macOS.zip dist/LaserGRBL-for-macOS.zip.sha256 --generate-notes --verify-tag
